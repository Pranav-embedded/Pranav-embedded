# Builds the big dashboard image (assets/github-metrics.svg) with lowlighter/metrics.
# One-time setup: create a token and save it as a repo secret named METRICS_TOKEN (see README_SETUP.md).
name: Metrics

on:
  schedule: [{ cron: "0 3 * * *" }]   # every day at 03:00 UTC
  workflow_dispatch:                  # lets you run it by hand from the Actions tab

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/github-metrics.svg
          committer_message: "chore: refresh metrics [skip ci]"

          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_display: columns
          config_timezone: Asia/Kolkata
          config_padding: 0, 8%

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_colors: github

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_lines: yes
          plugin_stars: yes
          plugin_stars_limit: 4
          plugin_pinned: yes
          plugin_pinned_limit: 4
          plugin_followup: yes
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
