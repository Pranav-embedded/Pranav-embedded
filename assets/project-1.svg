
<svg xmlns="http://www.w3.org/2000/svg" width="460" height="252" viewBox="0 0 460 252" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" role="img" aria-label="Synchronous FIFO">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#08141f"></stop>
    <stop offset="1" stop-color="#050b12"></stop>
  </linearGradient>

  <radialGradient id="glow" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#0f8fd0" stop-opacity="0.34"></stop>
    <stop offset="0.6" stop-color="#0b4f6c" stop-opacity="0.10"></stop>
    <stop offset="1" stop-color="#0b4f6c" stop-opacity="0"></stop>
  </radialGradient>
</defs>

<style>
.c{animation:fi .6s ease both}
@keyframes fi{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:none}
}
</style>

<g class="c">

<rect width="460" height="252" rx="16" fill="url(#bg)"></rect>
<rect width="460" height="252" rx="16" fill="url(#glow)"></rect>

<text x="28" y="56" fill="#1d5a7d" font-size="30" font-weight="700">01</text>
<text x="80" y="52" fill="#eaf7ff" font-size="19" font-weight="700">Synchronous FIFO</text>

<rect x="30" y="78" width="66.2" height="22" rx="11" fill="#0d2a3d" stroke="#1a5878"></rect>
<text x="40" y="93" fill="#7fd3ff" font-size="11" textLength="46.2" lengthAdjust="spacing">Verilog</text>

<rect x="104.2" y="78" width="59.6" height="22" rx="11" fill="#0d2a3d" stroke="#1a5878"></rect>
<text x="114.2" y="93" fill="#7fd3ff" font-size="11" textLength="39.6" lengthAdjust="spacing">Vivado</text>

<rect x="171.8" y="78" width="46.4" height="22" rx="11" fill="#0d2a3d" stroke="#1a5878"></rect>
<text x="181.8" y="93" fill="#7fd3ff" font-size="11" textLength="26.4" lengthAdjust="spacing">XSIM</text>

<rect x="30" y="125" width="6" height="6" rx="1.5" fill="#1aa7ec"></rect>
<text x="46" y="134" fill="#b7d9ea" font-size="13.5">Parameterized depth and data width</text>

<rect x="30" y="151" width="6" height="6" rx="1.5" fill="#1aa7ec"></rect>
<text x="46" y="160" fill="#b7d9ea" font-size="13.5">Full, empty and almost-full/empty flags</text>

<rect x="30" y="177" width="6" height="6" rx="1.5" fill="#1aa7ec"></rect>
<text x="46" y="186" fill="#b7d9ea" font-size="13.5">8 × 32-bit FIFO, waveform verification</text>

<rect x="30" y="212" width="144" height="24" rx="12" fill="#1aa7ec"></rect>
<text x="44" y="228" fill="#04131c" font-size="11.5" font-weight="700">RTL SIMULATED</text>

<rect x="0.75" y="0.75" width="458.5" height="250.5" rx="15.5" fill="none" stroke="#12354a" stroke-width="1.5"></rect>

</g>
</svg>
